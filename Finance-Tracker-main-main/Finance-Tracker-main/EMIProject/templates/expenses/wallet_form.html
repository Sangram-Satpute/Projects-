{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Wallet | FinTrack{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; margin: 40px auto; padding: 0 16px;">
    <div style="background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 24px; padding: 32px; box-shadow: var(--shadow-sm);">
        <h2 style="margin-top: 0; margin-bottom: 24px; font-weight: 800; font-size: 1.6rem; color: var(--text-main);">
            <i class="fa-solid fa-pen-to-square" style="color: var(--accent-blue);"></i> Edit Wallet
        </h2>

        <form method="POST">
            {% csrf_token %}
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: 600; margin-bottom: 8px; color: var(--text-main);">Wallet Name</label>
                {{ form.name }}
            </div>
            <div style="grid-template-columns: 1fr 1fr; display: grid; gap: 16px; margin-bottom: 20px;">
                <div>
                    <label style="display: block; font-weight: 600; margin-bottom: 8px; color: var(--text-main);">Account Type</label>
                    {{ form.wallet_type }}
                </div>
                <div>
                    <label style="display: block; font-weight: 600; margin-bottom: 8px; color: var(--text-main);">Balance (₹)</label>
                    {{ form.balance }}
                </div>
            </div>
            <div style="grid-template-columns: 1fr 1fr; display: grid; gap: 16px; margin-bottom: 20px;">
                <div>
                    <label style="display: block; font-weight: 600; margin-bottom: 8px; color: var(--text-main);">Last 4 Digits</label>
                    {{ form.account_number_last4 }}
                </div>
                <div>
                    <label style="display: block; font-weight: 600; margin-bottom: 8px; color: var(--text-main);">Theme Color</label>
                    {{ form.color }}
                </div>
            </div>
            <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 32px;">
                <a href="{% url 'wallet_dashboard' %}" class="btn" style="background: var(--bg-body); border: 1px solid var(--border-light); color: var(--text-main); padding: 12px 20px; border-radius: 12px; font-weight: 600; text-decoration: none;">Cancel</a>
                <button type="submit" class="btn" style="background: var(--accent-blue); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 700; cursor: pointer;">Update Wallet</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
